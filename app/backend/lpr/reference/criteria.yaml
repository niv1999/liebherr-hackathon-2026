  title: Liebherr brand page exists and is reachable
  lpr_ref: "#18"
  page_type: brand
  method: rule
  rule_key: brand_exists
  priority: high
  fix_hint: Set up a Liebherr brand page ("Markenwelt") with current Liebherr images and content.
- code: BRD-02
  block: visibility
  section: Brand page
  title: Current official Liebherr logo used
  lpr_ref: "#7"
  page_type: brand
  method: rule
  rule_key: brand_logo
  priority: medium
  fix_hint: Use the current Liebherr logo from the official asset package.
- code: BRD-03
  block: visibility
  section: Brand page
  title: Product categories presented (built-in / freestanding or cooling / freezing)
  lpr_ref: "#22"
  page_type: brand
  method: rule
  rule_key: brand_categories
  priority: medium
  fix_hint: Show Liebherr product categories, split into built-in vs freestanding (or cooling vs freezing).
- code: BRD-04
  block: visibility
  section: Brand page
  title: Key Liebherr technologies presented
  lpr_ref: "#26"
  page_type: brand
  method: rule
  rule_key: brand_technologies
  priority: medium
  fix_hint: Present the key Liebherr technologies (e.g. BioFresh, NoFrost, DuoCooling), each with its own section or page.
- code: BRD-05
  block: visibility
  section: Brand page
  title: Liebherr products / bestsellers shown on the brand page
  lpr_ref: "#23"
  page_type: brand
  method: rule
  rule_key: brand_products
  priority: medium
  fix_hint: Show Liebherr bestsellers or highlights with links to the product pages.
- code: BRD-06
  block: visibility
  section: Brand page
  title: Descriptive text about Liebherr (at least 200 words)
  lpr_ref: "#53"
  sk_levels: "2,3"
  page_type: brand
  method: rule
  rule_key: brand_seo_text
  priority: low
  fix_hint: Add a descriptive text of at least 200 words about Liebherr on the brand page.
- code: BRD-07
  block: visibility
  section: Brand page
  title: Brand page looks current and premium, no other brands
  description: Current campaign teaser, high-quality images, only Liebherr products.
  lpr_ref: "#19/#20/#21"
  page_type: brand
  method: ai
  rule_key: ai_design_quality
  priority: medium
  ai_prompt: |
    You see a screenshot of the top of a German retailer's Liebherr BRAND PAGE (shop-in-shop), plus its text.
    PASS if it looks clean, current and premium (large Liebherr images or campaign teaser, clear structure)
    AND it shows only Liebherr (no other brands' products or ads). FAIL if it looks outdated, cluttered, is
    just a plain product list, or other brands appear. In "evidence", describe what you see.
  fix_hint: Use the current Liebherr campaign teaser and only Liebherr content on the brand page.
- code: BRD-08
  block: advice
  section: Brand page
  title: Advice options (phone / video / advisor) shown on the brand page
  lpr_ref: "#24/#58"
  page_type: brand
  method: rule
  rule_key: brand_advice
  priority: medium
  fix_hint: Show advice options (phone with opening hours, video advice or a buying guide) on the brand page.

